[workspace]
members = [
    "app",
    "bench",
    "crates/cdm",
    "crates/core",
    "crates/document_core",
    "crates/document_view",
    "crates/expression",
    "crates/grid",
    "crates/lineage",
    "crates/profiler",
    "crates/project",
    "crates/query",
    "crates/split_view",
    "crates/storage",
    "crates/transform",
    "crates/workflow",
    "crates/workspace_core",
]
resolver = "2"

[workspace.package]
version = "0.46.0"
edition = "2021"
authors = ["Split Office Team"]

[workspace.dependencies]
# UI
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.35"

# Data
arrow = { version = "58", features = ["ipc"] }
polars = { version = "0.46", features = [
    "lazy",
    "csv",
    "parquet",
    "describe",
    "dtype-full",
    "streaming",
] }
duckdb = { version = "1.3", features = ["bundled", "r2d2"] }

# Async / threading
parking_lot = "0.12"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1   # speed up debug builds noticeably
